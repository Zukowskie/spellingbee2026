<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spelling Bee Word Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1B2430;
    --ink-soft: #2A3648;
    --paper: #FBF7EE;
    --honey: #D9A02C;
    --honey-deep: #B9821E;
    --charcoal: #2B2A28;
    --clay: #8A5A3C;
    --rule: #E3DBC8;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--ink);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(217,160,44,0.08), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(217,160,44,0.06), transparent 45%);
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--charcoal);
    padding: 48px 20px 80px;
  }

  header {
    max-width: 640px;
    margin: 0 auto 28px;
    text-align: left;
  }

  header h1 {
    font-family: 'Lora', serif;
    font-weight: 600;
    font-size: 1.5rem;
    color: var(--paper);
    margin: 0 0 4px;
    letter-spacing: 0.01em;
  }

  header p {
    color: #9AA6B8;
    margin: 0;
    font-size: 0.92rem;
  }

  .word-buttons {
    max-width: 640px;
    margin: 0 auto 24px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .word-buttons button {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.88rem;
    padding: 10px 18px;
    border-radius: 999px;
    border: 1px solid rgba(217,160,44,0.4);
    background: transparent;
    color: var(--honey);
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, transform 0.1s ease;
  }

  .word-buttons button:hover {
    background: var(--honey);
    color: var(--ink);
  }

  .word-buttons button:active {
    transform: scale(0.97);
  }

  .word-buttons button:focus-visible {
    outline: 2px solid var(--honey);
    outline-offset: 2px;
  }

  main {
    max-width: 640px;
    margin: 0 auto;
  }

  .card {
    background: var(--paper);
    border-radius: 10px;
    padding: 36px 40px 32px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    min-height: 200px;
  }

  .state-message {
    font-family: 'Inter', sans-serif;
    color: #7A756A;
    font-size: 0.95rem;
  }

  .state-message.error { color: #A6432F; }

  .headword-row {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }

  .headword {
    font-family: 'Lora', serif;
    font-weight: 600;
    font-size: 2.4rem;
    color: var(--ink);
    margin: 0;
    text-transform: lowercase;
  }

  .syllable-row {
    font-family: 'Lora', serif;
    font-size: 1.05rem;
    color: var(--clay);
    margin: 4px 0 2px;
    letter-spacing: 0.03em;
  }

  .sound-btn {
    border: none;
    background: none;
    cursor: pointer;
    padding: 4px;
    color: var(--clay);
    display: inline-flex;
    align-items: center;
  }

  .sound-btn:disabled { opacity: 0.25; cursor: default; }
  .sound-btn svg { width: 22px; height: 22px; }

  .pron-row {
    margin: 2px 0 6px;
    color: #6F6A5E;
    font-size: 0.95rem;
    font-family: 'Lora', serif;
    font-style: italic;
  }

  .fl {
    font-family: 'Lora', serif;
    font-style: italic;
    color: var(--clay);
    font-size: 0.95rem;
    margin: 4px 0 20px;
  }

  .definitions {
    margin: 0 0 24px;
    padding: 0;
    list-style: none;
    counter-reset: def-counter;
  }

  .definitions li {
    counter-increment: def-counter;
    position: relative;
    padding-left: 28px;
    margin-bottom: 18px;
    font-size: 1.02rem;
    line-height: 1.5;
  }

  .definitions li::before {
    content: counter(def-counter);
    position: absolute;
    left: 0;
    top: 1px;
    color: var(--honey-deep);
    font-family: 'Lora', serif;
    font-weight: 600;
    font-size: 0.92rem;
  }

  .example {
    display: block;
    margin-top: 6px;
    color: #5C574F;
    font-style: italic;
    font-size: 0.95rem;
    border-left: 2px solid var(--honey);
    padding-left: 10px;
  }

  .divider {
    border: none;
    border-top: 1px solid var(--rule);
    margin: 24px 0 20px;
  }

  .origin-label {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.85rem;
    color: var(--clay);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin: 0 0 6px;
  }

  .origin-text {
    font-family: 'Lora', serif;
    font-size: 0.98rem;
    line-height: 1.55;
    color: #4A4640;
    margin: 0;
  }

  .no-origin {
    font-size: 0.9rem;
    color: #A39D8E;
    font-style: italic;
    margin: 0;
  }

  @media (max-width: 480px) {
    .card { padding: 28px 22px 26px; }
    .headword { font-size: 1.9rem; }
  }
</style>
</head>
<body>

<header>
  <h1>Spelling Bee.</h1>
  <p>If it breaks, try hitting the button again.</p>
</header>

<div class="word-buttons">
  <button onclick="loadWord('A')">New easy word</button>
  <button onclick="loadWord('B')">New medium word</button>
  <button onclick="loadWord('C')">New hard word</button>
</div>

<main>
  <div class="card" id="card">
    <p class="state-message">Pick a difficulty above to pull a word.</p>
  </div>
</main>

<script>
  const SHEET_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzUy6DAMpwLh4oUHcv9HXjObCuQt-JchawCco8--saSUV9qEP839k2UQ7jCfR-8zAmv/exec';
  const MW_API_KEY = '7ee6e26a-1744-4608-be08-c9b8eb7da922';
  const MW_API_URL = 'https://www.dictionaryapi.com/api/v3/references/collegiate/json/';

  const card = document.getElementById('card');

  function setMessage(text, isError) {
    card.innerHTML = `<p class="state-message${isError ? ' error' : ''}">${text}</p>`;
  }

  async function fetchWord(column) {
    const res = await fetch(`${SHEET_SCRIPT_URL}?column=${column}`);
    if (!res.ok) throw new Error('Could not reach the word list.');
    const data = await res.json();
    if (!data.word) throw new Error('The word list returned nothing.');
    return data.word.trim();
  }

  async function fetchDefinition(word) {
    const res = await fetch(`${MW_API_URL}${encodeURIComponent(word)}?key=${MW_API_KEY}`);
    if (!res.ok) throw new Error('The dictionary lookup failed.');
    return res.json();
  }

  async function fetchAIExampleSentence(word) {
    try {
      const res = await fetch(`${SHEET_SCRIPT_URL}?action=getSentence&word=${encodeURIComponent(word)}`);
      if (!res.ok) return null;
      const data = await res.json();
      return data.sentence || null;
    } catch (err) {
      console.error("Failed to fetch AI sentence:", err);
      return null;
    }
  }

  function cleanMarkup(str) {
    if (!str || typeof str !== 'string') return '';
    return str
      .replace(/\{bc\}/g, ': ')
      .replace(/\{ldquo\}/g, '“')
      .replace(/\{rdquo\}/g, '”')
      .replace(/\{it\}|\{\/it\}/g, '')
      .replace(/\{b\}|\{\/b\}/g, '')
      .replace(/\{wi\}|\{\/wi\}/g, '')
      .replace(/\{phrase\}|\{\/phrase\}/g, '')
      .replace(/\{sx\|([^|}]*)\|[^}]*\}/g, '$1')
      .replace(/\{a_link\|([^}]*)\}/g, '$1')
      .replace(/\{d_link\|([^|}]*)\|[^}]*\}/g, '$1')
      .replace(/\{i_link\|([^|}]*)\|[^}]*\}/g, '$1')
      .replace(/\{et_link\|([^|}]*)\|[^}]*\}/g, '$1')
      .replace(/\{dx[^}]*\}|\{\/dx\}/g, '')
      .replace(/\{dx_def\}|\{\/dx_def\}/g, '')
      .replace(/\{[^}]*\}/g, '')
      .trim();
  }

  function buildAudioUrl(sound) {
    if (!sound || !sound.audio) return null;
    const audio = sound.audio;
    let subdir;
    if (audio.startsWith('bix')) subdir = 'bix';
    else if (audio.startsWith('gg')) subdir = 'gg';
    else if (/^[^a-zA-Z]/.test(audio)) subdir = 'number';
    else subdir = audio[0];
    return `https://media.merriam-webster.com/audio/prons/en/us/mp3/${subdir}/${audio}.mp3`;
  }

  function extractDefinitions(entry) {
    const items = [];
    const defBlocks = entry.def || [];

    function findSenses(node, results = []) {
      if (!node) return results;
      if (Array.isArray(node)) {
        if (node[0] === 'sense' && node[1] && node[1].dt) {
          results.push(node[1]);
        } else if (node[0] === 'bs' && node[1] && node[1].sense && node[1].sense.dt) {
          results.push(node[1].sense);
        } else {
          node.forEach(child => findSenses(child, results));
        }
      }
      return results;
    }

    defBlocks.forEach(defBlock => {
      const senses = findSenses(defBlock.sseq);
      senses.forEach(sense => {
        let text = '';
        let examples = [];

        (sense.dt || []).forEach(part => {
          if (part[0] === 'text') {
            text += cleanMarkup(part[1]);
          } else if (part[0] === 'vis' && Array.isArray(part[1])) {
            part[1].forEach(visItem => {
              if (visItem && visItem.t) examples.push(cleanMarkup(visItem.t));
            });
          }
        });

        if (text) items.push({ text, examples });
      });
    });

    if (items.length === 0 && entry.shortdef) {
      entry.shortdef.forEach(sd => items.push({ text: sd, examples: [] }));
    }
    return items;
  }

  function extractEtymology(entry) {
    if (!entry.et || !Array.isArray(entry.et)) return '';
    return entry.et
      .map(part => (Array.isArray(part) && typeof part[1] === 'string' ? cleanMarkup(part[1]) : ''))
      .filter(Boolean)
      .join(' ');
  }

  function render(word, entry, defs) {
    const rawHw = entry.hwi && entry.hwi.hw ? cleanMarkup(entry.hwi.hw) : word;
    const cleanHeadword = rawHw.replace(/[\*·\u00B7]/g, ''); 
    const syllabified = rawHw.split(/[\*·\u00B7]/).filter(Boolean).join(' · ');

    const pr = entry.hwi && entry.hwi.prs && entry.hwi.prs[0];
    const pronText = pr && pr.mw ? cleanMarkup(pr.mw) : '';
    const audioUrl = pr ? buildAudioUrl(pr.sound) : null;
    const fl = entry.fl || '';
    const etymology = extractEtymology(entry);

    const defsHtml = defs.length
      ? `<ol class="definitions">${defs.map(d => `
          <li>
            ${d.text}
            ${d.examples.map(ex => `<span class="example">“${ex}”</span>`).join('')}
          </li>
        `).join('')}</ol>`
      : `<p class="no-origin">No definition text was returned for this word.</p>`;

    card.innerHTML = `
      <div class="headword-row">
        <h2 class="headword">${cleanHeadword}</h2>
        <button class="sound-btn" id="sound-btn" ${audioUrl ? '' : 'disabled'} aria-label="Play pronunciation">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 5V4L8 9H4zm11.5 3c0-1.77-.77-3.29-2-4.24v8.48c1.23-.95 2-2.47 2-4.24z"/></svg>
        </button>
      </div>
      <div class="syllable-row">${syllabified}</div>
      ${pronText ? `<p class="pron-row">\\${pronText}\\</p>` : ''}
      ${fl ? `<p class="fl">${fl}</p>` : ''}
      ${defsHtml}
      <hr class="divider">
      <p class="origin-label">Language of Origin</p>
      ${etymology ? `<p class="origin-text">${etymology}</p>` : `<p class="no-origin">No etymology on file for this word.</p>`}
    `;

    if (audioUrl) {
      document.getElementById('sound-btn').addEventListener('click', () => {
        new Audio(audioUrl).play();
      });
    }
  }

  async function loadWord(column) {
    setMessage('Fetching a word…', false);
    let word;
    try {
      word = await fetchWord(column);
    } catch (err) {
      setMessage(`Couldn't get a word from the list: ${err.message}`, true);
      return;
    }

    let data;
    try {
      data = await fetchDefinition(word);
    } catch (err) {
      setMessage(`Couldn't look up "${word}": ${err.message}`, true);
      return;
    }

    if (!Array.isArray(data) || data.length === 0 || typeof data[0] === 'string') {
      setMessage(`No dictionary entry found for "${word}".`, true);
      return;
    }

    const entry = data.find(e => e.meta && e.meta.id.split(':')[0].toLowerCase() === word.toLowerCase()) || data[0];
    const defs = extractDefinitions(entry);

    if (defs.length > 0) {
      setMessage('Generating sample sentence…', false);
      const aiSentence = await fetchAIExampleSentence(word);
      if (aiSentence) {
        defs[0].examples = [aiSentence];
      }
    }

    render(word, entry, defs);
  }
</script>

</body>
</html>
